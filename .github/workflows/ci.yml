name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  native-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash -n scripts/*.sh
      # License statements must agree with LICENSE: the About panel's
      # copyright line in both configurations, and a README License section
      # that names the shipped notice and scopes MIT away from the artwork.
      - name: Check license statements
        run: |
          copyright="$(grep -m1 '^Copyright' LICENSE). $(head -1 LICENSE)."
          [ "$(grep -cF "INFOPLIST_KEY_NSHumanReadableCopyright = \"$copyright\";" claude-many.xcodeproj/project.pbxproj)" -eq 2 ]
          license_section="$(sed -n '/^## License/,$p' README.md)"
          grep -q 'LICENSE.txt' <<<"$license_section"
          grep -q 'media-sources/README.md' <<<"$license_section"
      # Runs the unit tests, builds the universal Release app and verifies its
      # signature. The gated live smoke test stays off: no real Claude Desktop.
      - run: scripts/build.sh --clean
      - run: test -x "build/Claude Replicant.app/Contents/MacOS/claude-replicant"
      - run: codesign --verify --strict "build/Claude Replicant.app"
      - name: Check app identity
        run: |
          plist="build/Claude Replicant.app/Contents/Info.plist"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist")" = 'Claude Replicant' ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")" = 'claude-replicant' ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = 'ch.lkmc.ClaudeReplicant' ]
          test -s "build/Claude Replicant.app/Contents/Resources/AppIcon.icns"
      - name: Check universal binary
        run: |
          lipo -archs "build/Claude Replicant.app/Contents/MacOS/claude-replicant" | grep -q arm64
          lipo -archs "build/Claude Replicant.app/Contents/MacOS/claude-replicant" | grep -q x86_64
