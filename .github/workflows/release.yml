name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  native-macos:
    name: Build native macOS release
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release source
        id: source
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(sed -n -E 's/^[[:space:]]*MARKETING_VERSION = ([0-9.]+);/\1/p' \
            claude-many.xcodeproj/project.pbxproj | head -1)"
          if [ "$tag_version" != "$app_version" ]; then
            echo "::error::tag v$tag_version != app version $app_version"
            exit 1
          fi

          if [ "$(git cat-file -t "$GITHUB_REF")" != 'tag' ]; then
            echo "::error::$GITHUB_REF must be an annotated tag"
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release commit is not on main"
            exit 1
          fi

          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: scripts/build.sh --clean

      - name: Package ZIP and DMG
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          mkdir -p release "$RUNNER_TEMP/claude-replicant-dmg"
          zip="release/claude-replicant-$VERSION-macos-universal.zip"
          dmg="release/claude-replicant-$VERSION-macos-universal.dmg"

          ditto -c -k --sequesterRsrc --keepParent "build/Claude Replicant.app" "$zip"
          ditto "build/Claude Replicant.app" "$RUNNER_TEMP/claude-replicant-dmg/Claude Replicant.app"
          ln -s /Applications "$RUNNER_TEMP/claude-replicant-dmg/Applications"
          hdiutil create -quiet -volname "Claude Replicant $VERSION" \
            -srcfolder "$RUNNER_TEMP/claude-replicant-dmg" -ov -format UDZO "$dmg"
          (cd release && shasum -a 256 \
            "claude-replicant-$VERSION-macos-universal.zip" \
            "claude-replicant-$VERSION-macos-universal.dmg" > SHA256SUMS.txt)

      # Fail before upload unless the app, the ZIP and the DMG carry LICENSE
      # verbatim and the app shows its copyright line.
      - name: Verify license notice
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          app="build/Claude Replicant.app"
          notice="Claude Replicant.app/Contents/Resources/LICENSE.txt"
          test -s "$app/Contents/Resources/LICENSE.txt"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :NSHumanReadableCopyright' "$app/Contents/Info.plist")" = "$(grep -m1 '^Copyright' LICENSE). $(head -1 LICENSE)." ]

          unzip -p "release/claude-replicant-$VERSION-macos-universal.zip" "$notice" | cmp - LICENSE

          mount="$RUNNER_TEMP/claude-replicant-dmg-check"
          mkdir -p "$mount"
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$mount" \
            "release/claude-replicant-$VERSION-macos-universal.dmg"
          cmp LICENSE "$mount/$notice"
          hdiutil detach -quiet "$mount"

      - name: Publish draft
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Claude Replicant ${{ steps.source.outputs.version }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          # One line per paragraph: release notes show every line break.
          body: |
            ### Unsigned build

            This app is ad-hoc signed, not Developer ID signed or notarized, so macOS blocks its first launch. On macOS 15 or later, open it once, then click Open Anyway in System Settings → Privacy & Security. On macOS 14, Control-click the app and choose Open.
          files: release/*

      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/published"
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/published" \
            --pattern 'claude-replicant-*-macos-*.zip' \
            --pattern 'claude-replicant-*-macos-*.dmg' \
            --pattern 'SHA256SUMS.txt'

          failed=0
          for file in release/*; do
            published="$RUNNER_TEMP/published/$(basename "$file")"
            if ! cmp -- "$file" "$published"; then
              gh release delete-asset "$GITHUB_REF_NAME" "$(basename "$file")" -y \
                || echo "::warning::failed to remove mismatched asset $(basename "$file")"
              echo "::error::published $(basename "$file") differed and was removed"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
